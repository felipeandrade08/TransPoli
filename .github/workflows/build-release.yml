name: Build Transpoli

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Transpoli.sln

      - name: Build
        run: dotnet build Transpoli.sln -c Release --no-restore

      - name: Publish app
        run: dotnet publish src/Transpoli.App/Transpoli.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish/Transpoli

      - name: Publish updater
        run: dotnet publish src/Transpoli.Updater/Transpoli.Updater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/Transpoli

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\Transpoli.iss"

      - name: Package portable ZIP
        shell: pwsh
        run: Compress-Archive -Path publish/Transpoli/* -DestinationPath Transpoli-win-x64.zip -Force

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Transpoli-Windows
          path: |
            Transpoli-win-x64.zip
            installer-output/Transpoli-Setup.exe
          retention-days: 14

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
          target_commitish: ${{ github.sha }}
          files: |
            Transpoli-win-x64.zip
            installer-output/Transpoli-Setup.exe
          generate_release_notes: true
